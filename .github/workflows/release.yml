name: Release

# Publishes to npm when a GitHub release is published.
#
# The only path is npm trusted publishing (OIDC) with provenance, which needs no secret. The package on npm
# trusts this repository and this workflow (release.yml) as its publisher.
#
# A release marked as a pre-release is published under the `beta` dist-tag; any other release (marked as
# latest, or with no label) is published under `latest`.

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest

    env:
      DIST_TAG: ${{ github.event.release.prerelease && 'beta' || 'latest' }}

    steps:
      - uses: actions/checkout@v5

      - name: Use Node.js 22
        uses: actions/setup-node@v6
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: npm

      # Trusted publishing needs npm 11.5.1 or newer. npm 12 requires Node 22.22.2 or newer, so pin 11.
      - name: Update npm
        run: npm install -g npm@11

      - name: Install dependencies
        run: npm ci

      - name: Lint, build and test
        run: npm test

      - name: Check the tag matches package.json
        run: |
          PKG_VERSION="$(node -p "require('./package.json').version")"
          TAG="${GITHUB_REF_NAME#v}"
          if [ "$PKG_VERSION" != "$TAG" ]; then
            echo "package.json version $PKG_VERSION does not match release tag $TAG"
            exit 1
          fi

      - name: Publish to npm with trusted publishing
        run: npm publish --provenance --access public --tag "$DIST_TAG"
